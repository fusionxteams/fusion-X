<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#061c33"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#cyanGlow)"/>

  <!-- Geometric Grid Pattern Lines (Subtle) -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Floating Medical Cross & DNA Curves -->
  <g transform="translate(400, 150)" filter="url(#glowEffect)">
    <circle cx="0" cy="0" r="64" fill="#0c1824" stroke="url(#goldAcc)" stroke-width="2.5"/>
    <!-- Aesthetic Caduceus Lotus -->
    <path d="M 0 -34 C -7 -18 -18 -10 -18 6 C -18 22 -6 30 0 30 C 6 30 18 22 18 6 C 18 -10 7 -18 0 -34 Z" fill="none" stroke="url(#goldAcc)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-22" r="5" fill="#38bdf8"/>
    <path d="M -14 4 C -22 10 -24 18 -14 24 C -6 22 -3 14 0 10" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 14 4 C 22 10 24 18 14 24 C 6 22 3 14 0 10" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0 -8 L 0 12 M -10 2 L 10 2" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Title & Typography -->
  <text x="400" y="270" font-family="'Outfit', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">Dr. Madhavi Anjimati</text>
  <text x="400" y="306" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="3" text-transform="uppercase">Advanced Clinical Aesthetics &amp; Dermatology</text>

  <!-- Verified Pill -->
  <g transform="translate(400, 360)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>
    <circle cx="-110" cy="0" r="5" fill="#10b981"/>
    <text x="12" y="5" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">3.8X CONSULTATION BOOKINGS</text>
  </g>
</svg>
