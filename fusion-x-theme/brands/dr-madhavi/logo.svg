<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="medGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Emblem Badge -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="30" fill="#0c1824" stroke="url(#medGrad)" stroke-width="2" filter="url(#medGlow)"/>
    <!-- Medical Caduceus / Aesthetic Lotus Stylized -->
    <path d="M 30 14 C 27 22 21 26 21 34 C 21 42 27 46 30 46 C 33 46 39 42 39 34 C 39 26 33 22 30 14 Z" fill="none" stroke="url(#medGrad)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="30" cy="20" r="3" fill="#38bdf8"/>
    <path d="M 23 33 C 18 36 17 40 22 43 C 26 42 28 38 30 36" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 37 33 C 42 36 43 40 38 43 C 34 42 32 38 30 36" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Plus Cross Accent -->
    <path d="M 30 26 L 30 36 M 25 31 L 35 31" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="82" y="34" font-family="'Outfit', 'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.2">Dr. Madhavi</text>
  <text x="202" y="34" font-family="'Outfit', 'Space Grotesk', -apple-system, sans-serif" font-size="19" font-weight="600" fill="#38bdf8" letter-spacing="0.2">Anjimati</text>
  <text x="83" y="52" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="1.4" text-transform="uppercase">Aesthetics &amp; Wellness Clinic</text>
</svg>
